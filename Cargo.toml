[package]
name = "liteweight-fps-wasm"
version = "0.1.0"
edition = "2021"
authors = ["issy20"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
wgpu = "24"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "console",
    "Document",
    "Element",
    "GainNode",
    "HtmlCanvasElement",
    "Storage",
    "Window",
] }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
