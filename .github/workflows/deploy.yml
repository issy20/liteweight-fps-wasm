name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo check --target wasm32-unknown-unknown

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Set service worker cache version
        run: sed -i "s/liteweight-fps-v[0-9]*/liteweight-fps-${GITHUB_SHA::7}/" sw.js
      - run: trunk build --release
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: >-
            npx wrangler pages project list | grep -q "liteweight-fps-wasm"
            || npx wrangler pages project create liteweight-fps-wasm --production-branch=main
          command: >-
            pages deploy dist --project-name=liteweight-fps-wasm
            --branch=${{ github.head_ref || github.ref_name }}
