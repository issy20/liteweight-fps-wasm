<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>liteweight-fps</title>
    <meta name="theme-color" content="#0a0d12" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link data-trunk rel="copy-file" href="credits.html" />
    <link data-trunk rel="copy-file" href="LICENSE-MIT" />
    <link data-trunk rel="copy-file" href="LICENSE-APACHE" />
    <link data-trunk rel="copy-file" href="assets/fonts/OFL.txt" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0d12;
      }
      #game-canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        outline: none;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        box-sizing: border-box;
        text-align: center;
        background: #0a0d12;
        color: #d0d6e0;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      #loading {
        z-index: 10;
      }
      #fallback {
        z-index: 20;
        display: none;
      }
      #touch-notice {
        z-index: 30;
        display: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f0923c;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #touch-notice {
        display: none;
      }
      @media (pointer: coarse) and (hover: none) {
        #touch-notice {
          display: flex;
        }
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="1"></canvas>
    <div id="loading" class="overlay">
      <div class="spinner"></div>
      <p id="loading-text">LOADING</p>
    </div>
    <div id="fallback" class="overlay">
      <h1>WebGPU が必要です</h1>
      <p>
        このゲームは WebGPU を使用します。Chrome / Edge 113+ など WebGPU
        対応ブラウザで、chrome://flags の WebGPU を有効にして実行してください。
      </p>
    </div>
    <div id="touch-notice" class="overlay">
      <h1>デスクトップ専用です</h1>
      <p>
        このゲームはキーボードとマウス（ポインタロック）を必要とするため、
        デスクトップ環境のブラウザでお楽しみください。
      </p>
    </div>
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"
    />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
